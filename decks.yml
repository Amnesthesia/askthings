# Source of truth for every deck: metadata, how the game flows, and the
# generation brief. `pnpm sync` writes name/blurb/kind/play/tiers into
# content/{deck}.json (cards are preserved; a missing file is created empty).
# Adding a game = adding a block here and running `pnpm sync`.
#
# play.order: sequential (file order, no shuffle) | random (shuffled when
#   opened) | free (file order, shuffle offered).
# play.cardsPerTier: deal at most this many per level per session; null = all.
# play.howToPlay: shown on the deck page and behind the game's help button.
# generation.candidatesPerTier: asked per provider per tier per call.
# generation.targetPerTier: publish keeps the best cards up to this many.
# generation.wholeRun: the deck is one complete run per provider (21 Questions):
#   asked at targetPerTier, kept or dropped whole, one run published.
# generation.models: optional per-provider model override for this deck, e.g.
#   models: { anthropic: claude-sonnet-5, gemini: gemini-3.8-flash, openai: gpt-5.6-terra }
#   Defaults (and RATE_MODEL / SAFETY_MODEL for the judges) live in src/stage.ts.
# tiers[].name/description/guidance/intensity are for prompts and publishing
#   only; the site shows "Level n" and nothing else.

inquisitives:
  name: Inquisitives
  blurb: "Questions for skipping small talk. Start anywhere; go as deep as the other person lets you."
  kind: question
  play:
    order: free
    cardsPerTier: null
    howToPlay:
      - "Whoever draws the card answers first, then asks it back."
      - "Swipe sideways for another card at this level; swipe up to go deeper."
      - "Go as deep as the other person lets you, and no deeper."
  generation:
    candidatesPerTier: 25
    targetPerTier: 30
    brief: |
      A card is ONE question a curious interviewer would ask a stranger to skip small talk.
      Mechanic: two or more people, any card, any order; whoever draws it answers first.
      Rules: at most 22 words; exactly one question mark; answerable without preparation;
      never "What's one thing…", never a list request ("name three…"). Ask about a specific
      moment or a real opinion, not a category.
      Exemplars:
      - "What do you like to learn about?"
      - "Who taught you something you still use?"
      - "What did you believe for a long time that turned out to be wrong?"
      - "What have you been avoiding?"
  tiers:
    - level: 1
      name: Openers
      description: "Easy to answer, hard to answer boringly."
      intensity: 1
      guidance: >-
        Taste, habits, small stories: things a stranger answers in one breath and enjoys answering.
        IN: "What can you cook without a recipe?", "Which stranger has stuck in your head?"
        TOO DEEP for this level: anything about fear, regret, family wounds, or the other person.
        TOO SHALLOW: pure preference with no story behind it ("favourite colour?").
    - level: 2
      name: Unguarded
      description: "Opinions, and the experiences that formed them."
      intensity: 2
      guidance: >-
        Opinions and the experiences that formed them; how they see the world; formative but not painful.
        IN: "What's the worst advice you ever followed?", "What do you pretend to like because people expect you to?"
        TOO SHALLOW: daily habits and trivia with no opinion in them ("what do you eat alone?").
        TOO DEEP: shame, grief, fear, or what they are working through now.
    - level: 3
      name: Vulnerable
      description: "Needs some trust in the room."
      intensity: 3
      guidance: >-
        What they are working through, what they avoid, values under pressure, regret, identity.
        IN: "Where in your life are you playing it too safe?", "Whose approval are you still trying to win?"
        Assumes an evening of rapport. TOO DEEP: mortality, the unsayable, or direct questions about the person asking.
    - level: 4
      name: Intimate
      description: "For people who have already gone somewhere together."
      intensity: 4
      guidance: >-
        Mortality, meaning, the things rarely said out loud, and the person across the table ("me").
        IN: "What do you think I'd be shocked to learn about you?", "What keeps you awake at three in the morning?"
        About a third of the cards should be about the two people in the room. Nothing here is small talk.

never-have-i-ever:
  name: Never Have I Ever
  blurb: "Statements, not questions. Everyone who has done it puts a finger down, and then tells the story."
  kind: question
  play:
    order: random
    cardsPerTier: null
    howToPlay:
      - "Read the card aloud. Everyone who HAS done it puts a finger down (or drinks)."
      - "Anyone who put a finger down owes the table the story."
      - "Swipe up when the room is ready for the next level."
  generation:
    candidatesPerTier: 25
    targetPerTier: 25
    brief: |
      A card is ONE first-person statement that begins exactly "Never have I ever" and names one
      concrete act in the present perfect. Mechanic: read aloud; everyone who HAS done it puts a
      finger down or drinks, and usually has to tell the story. So pick acts with a story behind
      them, not yes/no facts about identity or possessions.
      Rules: starts with "Never have I ever"; at most 18 words; one act, no "or"; adults only,
      consensual and legal; nothing that pressures anyone to confess a crime.
      Exemplars:
      - "Never have I ever pretended to know a song I had never heard."
      - "Never have I ever cried at an advert."
      - "Never have I ever ghosted someone I actually liked."
      - "Never have I ever lied about my age to get into somewhere."
  tiers:
    - level: 1
      name: Harmless
      description: "Small embarrassments anyone will admit."
      intensity: 1
      guidance: >-
        Everyday small embarrassments anyone owns up to with a laugh: social slips, clumsiness, tiny fibs.
        IN: "waved back at someone waving at somebody else", "fallen asleep in a cinema".
        TOO DEEP: anything involving another person's feelings, rules broken, or romance.
    - level: 2
      name: Cheeky
      description: "Things you did and got away with."
      intensity: 2
      guidance: >-
        Mild mischief and getting away with it: white lies, skiving, petty theft of snacks, crushes, small cheats.
        IN: "called in sick to do nothing", "cheated at a board game against a child".
        TOO SHALLOW: pure clumsiness. TOO DEEP: anything that hurt someone or costs something to admit.
    - level: 3
      name: Confessional
      description: "Now it costs something to put a finger down."
      intensity: 3
      guidance: >-
        It costs something to put a finger down: regret, heartbreak, jealousy, small betrayals of friends and family.
        IN: "stayed in a relationship months after I knew it was over", "skipped a funeral I should have gone to".
        Not sexual yet. TOO SHALLOW: mischief with no one hurt.
    - level: 4
      name: Spicy
      description: "Adults only, and the story is the point."
      intensity: 4
      guidance: >-
        Adults only: sex, romance and wild nights between consenting adults, where the STORY is the point.
        IN: "kissed a friend and pretended the next morning it never happened", "cried straight after sex".
        Never illegal, never anyone under 18, never degrading, never a bare act with no story ("had a threesome" is a fact, not a card).

fast-friends:
  name: Fast Friends
  blurb: "Three sets of twelve, done in order, both of you answering. Each set asks a little more than the last."
  kind: question
  play:
    order: sequential
    cardsPerTier: 12
    howToPlay:
      - "Two people. Work through the three sets in order; do not skip ahead."
      - "Both of you answer every card, taking turns to go first."
      - "Give it about forty-five minutes. Set three is where it lands."
  generation:
    candidatesPerTier: 25
    targetPerTier: 12
    brief: |
      This deck follows the Fast Friends procedure from Aron et al. (1997): two people work
      through three sets of twelve questions in order, BOTH answering every question, with each set
      more self-disclosing than the last. Write ORIGINAL questions in that spirit. Do not reproduce
      or lightly paraphrase the published 1997 list.
      Reciprocity principle: both people answer, so every question must be equally answerable by
      two strangers with different lives. Rules: at most 30 words; may be two-part ("…? Why?");
      up to a third of the cards may be instructions ("Tell your partner…", "Share…"); no
      yes/no questions.
      Exemplars:
      - "If you could have dinner with anyone alive, who, and what would you want to ask them?"
      - "Tell your partner about the last time you felt properly proud of yourself."
      - "What do you value most in a friend, and when did you last fail at it yourself?"
      - "Share something you like about the person across from you that they might not know."
  tiers:
    - level: 1
      name: Set one
      description: "Warm, curious, low stakes."
      intensity: 1
      guidance: >-
        Set one: warm and curious. Preferences, small stories, an ideal day, a place they'd return to.
        IN: "Tell your partner one story about your name.", "If tomorrow were empty, how would you spend it?"
        Both people answer comfortably within a minute of meeting. Nothing about family pain or the other person yet.
    - level: 2
      name: Set two
      description: "Personal history and how they see themselves."
      intensity: 3
      guidance: >-
        Set two: personal history and how they see themselves. Childhood, family, what they'd change, what they hide.
        IN: "Which parent are you more like, and how do you feel about that?", "Who believed in you before you'd earned it?"
        Real disclosure, still safe: no direct questions about the partner, no mortality.
    - level: 3
      name: Set three
      description: "The two of you, and the things rarely said."
      intensity: 4
      guidance: >-
        Set three: the two of you, and the things rarely said. Half the cards address the partner directly.
        IN: "Tell your partner what you noticed about them in the first minute, and whether you were right.",
        "If you died tonight, what would you most regret not having told someone? Why haven't you told them?"
        Reciprocal and direct; ends with something both will remember.

twenty-one-questions:
  name: 21 Questions
  blurb: "One run of twenty-one, played in order, taking turns. It starts light and ends somewhere."
  kind: question
  play:
    order: sequential
    cardsPerTier: 21
    howToPlay:
      - "Two people, taking turns: one asks, the other answers, then swap."
      - "Play the cards in order. The run is built to climb."
      - "No skipping. You may ask a follow-up before moving on."
  generation:
    wholeRun: true
    candidatesPerTier: 21
    targetPerTier: 21
    brief: |
      Write ONE complete run of exactly 21 questions to be played in order by two people taking
      turns. This is a sequence, not a pool: it should start warm, move through curious and
      personal, and end with one closing question that lands. Rules: at most 20 words each; no
      two adjacent questions on the same topic; no yes/no questions; question 21 should be one
      they will still be talking about afterwards.
      Exemplars for the arc:
      - Q1 "What's the best thing that happened to you this week?"
      - Q8 "What's something you're good at that you never get to use?"
      - Q15 "When did you last surprise yourself?"
      - Q21 "What would you want me to remember about this conversation?"
  tiers:
    - level: 1
      name: The run
      description: "Twenty-one questions, in order."
      intensity: 2
      guidance: >-
        The whole arc from warm to personal, in order. Cards 1-5 exposure 1, 6-12 exposure 2, 13-19 exposure 3, 20-21 exposure 3-4.
        Rate each card's intensity honestly so the climb is visible. No two adjacent cards on one topic.
        Card 21 turns back to the two people talking.

would-you-rather:
  name: Would You Rather
  blurb: "Two options, both hard to pick. Choose one, then defend it."
  kind: pair
  play:
    order: random
    cardsPerTier: null
    howToPlay:
      - "Everyone picks A or B. No abstaining."
      - "Then everyone defends their pick. That is the game."
      - "Swipe up when the easy ones stop being interesting."
  generation:
    candidatesPerTier: 25
    targetPerTier: 25
    brief: |
      A card is two options, a and b, that are genuinely hard to choose between and reveal a
      value or a fear, not a gross-out. Mechanic: pick one, then explain; the explanation is the
      conversation. Rules: each option at most 12 words; parallel grammar (both start the same
      way); neither obviously better; no bodily-fluid humour; use "…for the rest of your life"
      at most once per batch; do not write the words "Would you rather", the site adds them.
      Exemplars:
      - a: "know how you will die" / b: "know when you will die"
      - a: "be the funniest person in every room" / b: "be the smartest person in every room"
      - a: "lose every photo you have ever taken" / b: "lose every message you have ever sent"
      - a: "be forgotten after you die" / b: "be remembered for the wrong reason"
  tiers:
    - level: 1
      name: Playful
      description: "Preferences and superpowers."
      intensity: 1
      guidance: >-
        Playful: powers, food, travel, habits, silly trade-offs. Reveals taste, nothing more.
        IN: "fly at walking speed / run at motorway speed", "wear only bright colours / wear only black and white".
        TOO DEEP: money, career, family, death.
    - level: 2
      name: Revealing
      description: "Trade-offs about time, money, fame and comfort."
      intensity: 2
      guidance: >-
        Revealing: real trade-offs about time, money, fame, comfort, work. Each pick says what they value.
        IN: "work four days a week for half the pay / six days for double", "be loved by everyone who barely knows you / by three who know everything".
        TOO SHALLOW: logistics with no value at stake ("arrive early / arrive late").
    - level: 3
      name: Uncomfortable
      description: "Loyalty, mortality, identity."
      intensity: 3
      guidance: >-
        Uncomfortable: loyalty, mortality, identity, the people they love. Both options cost something real.
        IN: "forgive the person who hurt you most / be forgiven by the person you hurt most",
        "know which of your friendships is one-sided / never know and keep them all".

thought-experiments:
  name: Thought Experiments
  blurb: "The classics and some new ones. A scenario, the question it forces, and the follow-ups that make it bite."
  kind: dilemma
  play:
    order: free
    cardsPerTier: null
    howToPlay:
      - "One person reads the setup and the question. Everyone answers before anyone argues."
      - "Then work through the follow-ups. That is where it gets interesting."
      - "Nobody has to be consistent. Notice when you are not."
  generation:
    candidatesPerTier: 10
    targetPerTier: 12
    brief: |
      A card is a thought experiment or moral dilemma with four parts: a short title; a setup
      (the scenario, at most 120 words, plain words, no jargon, no philosopher's names in the
      text); the dilemma (the ONE question the scenario forces); and 2-3 probes, follow-up
      questions that push on whichever answer was given ("Would that change if…", "What if it
      were your…"). The probes are where the conversation happens; make them sharper than the
      dilemma.
      Two kinds of card. CANONICAL: retell a well-known experiment in this voice and put the
      standard attribution in `origin` (e.g. "Philippa Foot, 1967", "Robert Nozick, 1974",
      "Plutarch / Hobbes", "John Rawls, 1971", "John Searle, 1980", "Frank Jackson, 1982",
      "Derek Parfit, 1984", "Peter Singer, 1972", "William Newcomb / Robert Nozick, 1969").
      ORIGINAL: a new dilemma about ordinary life (money, friends, family, work, technology)
      with `origin` null. Never invent an attribution.
      Canonical experiments to cover (one card each, best retelling wins): Trolley Problem;
      the Fat Man / Footbridge variant; Experience Machine; Ship of Theseus; Veil of Ignorance;
      Chinese Room; Mary's Room; the Teleporter; the Lifeboat; the Drowning Child; the
      Repugnant Conclusion; Newcomb's Problem; the Sorites heap; the Violinist; Plato's Cave;
      the Ring of Gyges; the Utility Monster; Pascal's Wager.
  tiers:
    - level: 1
      name: Puzzling
      description: "Abstract and fun to argue about."
      intensity: 1
      guidance: >-
        Puzzling: identity, knowledge, meaning, logic. Nobody has to confess anything to have a view.
        CANONICAL EXPERIMENTS FOR THIS LEVEL ONLY: Ship of Theseus, Chinese Room, Mary's Room, the Teleporter, the Sorites heap, Plato's Cave, Newcomb's Problem.
        Original cards here are about objects, copies, memory, words and what makes something real. Do not retell experiments assigned to other levels.
    - level: 2
      name: Uncomfortable
      description: "A real trade-off you might actually face."
      intensity: 2
      guidance: >-
        Uncomfortable: fairness, harm, promises, money. A trade-off the player might actually face; the answer says something about them.
        CANONICAL EXPERIMENTS FOR THIS LEVEL ONLY: Trolley Problem, the Footbridge / Fat Man variant, Ring of Gyges, the Repugnant Conclusion, the Utility Monster, Pascal's Wager, Veil of Ignorance.
        Original cards here are about strangers, colleagues, money found or owed, small lies with real consequences.
    - level: 3
      name: Personal
      description: "It asks what you would actually do, and why you haven't."
      intensity: 3
      guidance: >-
        Personal: it asks what YOU would actually do, and why you haven't. Turns on the player's own family, work, body, debts.
        CANONICAL EXPERIMENTS FOR THIS LEVEL ONLY: the Drowning Child, the Violinist, the Lifeboat, the Experience Machine.
        Original cards here name the player's own life ("your sister", "your salary", "the person you'd write down"). Probes should ask for a number, a name, or a reason they have not acted.

undercurrent:
  name: Undercurrent
  blurb: "For two people who want to get closer. Three levels; take turns; you may pass once per level."
  kind: question
  play:
    order: random
    cardsPerTier: 15
    howToPlay:
      - "Two people. Take turns drawing; the drawer answers first, honestly."
      - "You may pass once per level. Say so out loud."
      - "Finish a level before going deeper. Level three is the point."
  generation:
    candidatesPerTier: 25
    targetPerTier: 20
    brief: |
      A closeness deck for two people, in the escalating-intimacy card format: three levels,
      taken in turns, answered honestly, with one pass allowed per level. Write ORIGINAL cards.
      Do not reference, imitate, or paraphrase "We're Not Really Strangers" or any commercial
      card game; that name and its card text are someone else's property. The format is free;
      the words are ours.
      Rules: at most 20 words; addressed to "you" and "me", these cards are about the two people
      at the table, not about life in general; up to a third may be instructions ("Tell me…",
      "Describe…"); no therapy vocabulary (no "boundaries", "process", "hold space", "journey").
      Exemplars:
      - "What did you notice about me first?"
      - "What do you think we have in common that we haven't talked about?"
      - "Tell me something you assumed about me that turned out to be wrong."
      - "What have you wanted to say to me tonight and haven't?"
  tiers:
    - level: 1
      name: Surface
      description: "Noticing each other."
      intensity: 2
      guidance: >-
        Surface: noticing each other. First impressions, guesses about the other person, easy honesty said to their face.
        IN: "What did you notice about me first?", "Guess the last thing that made me cry."
        TOO DEEP: what is wrong between you, fear, or what has gone unsaid.
    - level: 2
      name: Current
      description: "What is actually between you."
      intensity: 3
      guidance: >-
        Current: what is actually between you. What each holds back, avoids, wants from the other, misunderstands.
        IN: "What do you hold back from telling me?", "What part of your life have you kept me out of?"
        Both people at the table are the subject. TOO SHALLOW: guessing games about habits.
    - level: 3
      name: Depth
      description: "The unsaid."
      intensity: 4
      guidance: >-
        Depth: the unsaid. What they've been afraid to ask, where they've let each other down, what would change things.
        IN: "What have you forgiven me for without telling me?", "What have you been afraid to tell me because it could change us?"
        Every card is addressed to the other person and could change the evening.
